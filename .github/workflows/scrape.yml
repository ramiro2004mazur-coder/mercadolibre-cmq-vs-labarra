name: Scrape MercadoLibre CMQ vs La Barra

on:
  schedule:
    # 10:15 y 19:00 hora Argentina (UTC-3, sin horario de verano) => 13:15 y 22:00 UTC
    - cron: "15 13 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      turno:
        description: "Forzar turno (AM/PM). Vacio = auto segun hora actual en Argentina."
        required: false
        type: choice
        options: ["", "AM", "PM"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scrape-mercadolibre
  cancel-in-progress: false

jobs:
  scrape-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r scraper/requirements.txt

      - name: Instalar Chromium (Playwright)
        run: playwright install --with-deps chromium

      - name: Correr scraper
        run: |
          if [ -n "${{ github.event.inputs.turno }}" ]; then
            python scraper/scrape_mercadolibre.py --turno "${{ github.event.inputs.turno }}"
          else
            python scraper/scrape_mercadolibre.py
          fi

      - name: Reconstruir data.json del dashboard
        run: python scripts/build_dashboard_data.py

      - name: Commit y push del historico actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/data.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos, no se hace commit."
          else
            git commit -m "chore: actualizar historico de precios ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi

      - name: Preparar artifact de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
